name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main into fork main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/xintaofei/codeg.git
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Verify merged web build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish merge and dispatch release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push origin main

          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          RELEASE_TAG="v${APP_VERSION}"
          echo "Resolved release tag: ${RELEASE_TAG}"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists"
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
            echo "Created tag ${RELEASE_TAG}"
          fi

          RELEASE_DRAFT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft' 2>/dev/null || echo missing)
          if [[ "${RELEASE_DRAFT}" == "false" ]]; then
            echo "Published release ${RELEASE_TAG} already exists; skip dispatch"
          else
            echo "Dispatching Release workflow for ${RELEASE_TAG}"
            gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${RELEASE_TAG}" -f tag="${RELEASE_TAG}"
          fi
